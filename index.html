<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Djifa Cacao — Authentisch. Natürlich. Handgemachte Schokolade & Kakao-Produkte." />
  <title>Djifa Cacao - Authentisch. Natürlich</title>

  <!-- favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <style>
    :root{
      --bg: #faf9f6;
      --text: #333333;
      --accent-dark: #2b2b2b;
      --muted-shadow: rgba(0,0,0,0.05);
      --max-width: 750px;
      --radius: 6px;
      --transition: 0.25s ease;
    }

    /* Basic page layout */
    html,body{
      height:100%;
      margin:0;
      padding:0;
      background-color:var(--bg);
      color:var(--text);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
      box-sizing:border-box;
    }

    .content-container{
      width:100%;
      max-width:var(--max-width);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:28px;
      padding:32px;
      box-sizing:border-box;
    }

    /* Image / flyer */
    .flyer {
      width:100%;
      height:auto;
      display:block;
      border-radius:var(--radius);
      box-shadow:0 10px 30px var(--muted-shadow);
      opacity:0;
      transform:translateY(20px);
      animation:fadeInUp 700ms cubic-bezier(.2,.9,.2,1) forwards;
      object-fit:cover;
    }
    .flyer-1 { animation-delay:0.15s; }
    .flyer-2 { animation-delay:0.55s; }

    @keyframes fadeInUp{
      to { opacity:1; transform:translateY(0); }
    }

    /* Buttons */
    .button-group{
      margin-top:4px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center; /* fixed invalid rule */
      width:100%;
      opacity:0;
      animation:fadeInUp 700ms cubic-bezier(.2,.9,.2,1) forwards;
      animation-delay:1s;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:12px 22px;
      font-size:14px;
      letter-spacing:1px;
      text-transform:uppercase;
      border-radius:4px;
      text-decoration:none;
      transition:all var(--transition);
      font-weight:600;
      cursor:pointer;
      min-width:120px;
      box-sizing:border-box;
    }

    .btn-instagram{
      background:var(--accent-dark);
      color:#fff;
      border:1px solid var(--accent-dark);
    }
    .btn-instagram:hover{ background:#404040; border-color:#404040; }
    .btn-email{
      background:transparent;
      color:var(--accent-dark);
      border:1px solid var(--accent-dark);
    }
    .btn-email:hover{
      background:var(--accent-dark);
      color:#fff;
    }

    /* Focus styles for keyboard users */
    .btn:focus{
      outline:3px solid rgba(43,43,43,0.12);
      outline-offset:2px;
    }

    /* Mobile tweaks */
    @media (max-width:480px){
      body{ padding:20px 12px; }
      .content-container{ padding:20px; gap:20px; }
      .button-group{ flex-direction:column; width:100%; }
      .btn{ width:100%; min-width:0; justify-content:center; }
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce){
      .flyer, .button-group { animation: none; opacity:1; transform:none; }
    }

    /* Ensure images are visible when JavaScript/CSS disabled */
    noscript .flyer { opacity:1; transform:none; }
  </style>
</head>
<body>
  <main class="content-container" role="main" aria-labelledby="brand-heading">
    <h1 id="brand-heading" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">Djifa Cacao</h1>

    <!-- Responsive images with lazy loading and alt text -->
    <!-- Replace the src/srcset values with actual responsive images if available -->
    <img
      src="flyer1.jpg"
      alt="Djifa Cacao Flyer Vorderseite"
      class="flyer flyer-1"
      loading="lazy"
      width="1200"
      height="800"
    />

    <img
      src="flyer2.jpg"
      alt="Djifa Cacao Flyer Rückseite"
      class="flyer flyer-2"
      loading="lazy"
      width="1200"
      height="800"
    />

    <div class="button-group" role="navigation" aria-label="Kontakt-Links">
      <!-- EXTERNAL LINKS: include rel for security when target=_blank -->
      <a
        class="btn btn-instagram"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Öffne Djifa Cacao auf Instagram"
      >
        Instagram
      </a>

      <!-- Email link: replace example with your actual address, e.g. mailto:info@djifacacao.de -->
      <a
        class="btn btn-email"
        href="#"
        aria-label="E-Mail an Djifa Cacao senden"
      >
        E-Mail Kontakt
      </a>
    </div>
  </main>

  <!-- Provide a fallback if CSS/animations are disabled -->
  <noscript>
    <style> .flyer { opacity:1; transform:none; } .button-group { opacity:1; } </style>
  </noscript>
</body>
</html>
